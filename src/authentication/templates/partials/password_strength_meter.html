{# Live password strength meter. Include with: field_id = id of the password input. #}
<div class="pw-meter" id="pw-meter-{{ field_id }}" hidden>
    <div class="pw-meter-track"><span class="pw-meter-fill"></span></div>
    <p class="pw-meter-label"></p>
    <p class="pw-meter-info"></p>
</div>

<style>
    .pw-meter { margin: 8px 0 4px; }
    .pw-meter-track {
        height: 8px;
        border-radius: 999px;
        background: var(--line, #dbe3ee);
        overflow: hidden;
    }
    .pw-meter-fill {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 999px;
        transition: width .2s ease, background-color .2s ease;
    }
    .pw-meter-label { margin: 6px 0 0; font-size: 14px; font-weight: 700; }
    .pw-meter-info { margin: 2px 0 0; font-size: 13px; color: var(--muted, #637086); }
    .pw-s0 { background: #b3261e; } .pw-t0 { color: #b3261e; }
    .pw-s1 { background: #d9822b; } .pw-t1 { color: #d9822b; }
    .pw-s2 { background: #c5a01d; } .pw-t2 { color: #9a7d12; }
    .pw-s3 { background: #5a9e3a; } .pw-t3 { color: #4d8a2f; }
    .pw-s4 { background: #1c7c54; } .pw-t4 { color: #1c7c54; }
</style>

<script>
(function () {
    var field = document.getElementById("{{ field_id }}");
    var meter = document.getElementById("pw-meter-{{ field_id }}");
    if (!field || !meter) return;

    var fill = meter.querySelector(".pw-meter-fill");
    var label = meter.querySelector(".pw-meter-label");
    var info = meter.querySelector(".pw-meter-info");
    var widths = ["20%", "40%", "60%", "80%", "100%"];
    var timer = null;

    function render(data) {
        meter.hidden = false;
        var score = data.score;
        fill.className = "pw-meter-fill pw-s" + score;
        fill.style.width = widths[score];
        label.className = "pw-meter-label pw-t" + score;
        label.textContent = "Siła hasła: " + data.label;
        if (data.is_common) {
            info.textContent = "To hasło znajduje się na liście popularnych haseł.";
        } else {
            info.textContent = "Szacowana entropia: " + data.entropy + " bitów.";
        }
    }

    function check() {
        var value = field.value || "";
        if (!value) { meter.hidden = true; return; }
        fetch("{% url 'authentication:password_strength' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRFToken": "{{ csrf_token }}",
            },
            body: "password=" + encodeURIComponent(value),
        })
            .then(function (r) { return r.json(); })
            .then(render)
            .catch(function () { /* meter is best-effort */ });
    }

    field.addEventListener("input", function () {
        clearTimeout(timer);
        timer = setTimeout(check, 250);
    });
})();
</script>

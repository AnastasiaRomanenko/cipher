<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Panel operatora | Szyfr24{% endblock %}</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --ink: #132033;
            --muted: #637086;
            --line: #dbe3ee;
            --primary: #146b63;
            --primary-dark: #0e4d47;
            --danger: #b3261e;
            --success: #1c7c54;
            --warning: #9a6500;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--ink);
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .topbar {
            background: #fff;
            border-bottom: 1px solid var(--line);
        }

        .topbar-inner,
        .page {
            width: min(1180px, 100%);
            margin: 0 auto;
            padding: 0 22px;
        }

        .topbar-inner {
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: var(--ink);
            font-weight: 800;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: var(--primary);
            color: #fff;
            font-size: 13px;
        }

        .page {
            padding-top: 28px;
            padding-bottom: 44px;
        }

        .page-header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 22px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 30px;
            letter-spacing: 0;
        }

        .muted {
            margin: 0;
            color: var(--muted);
            line-height: 1.5;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 12px 32px rgba(19, 32, 51, 0.08);
            padding: 22px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 680px;
        }

        th,
        td {
            padding: 13px 12px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: middle;
        }

        th {
            color: #334156;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0;
            background: #f8fafc;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334156;
            font-weight: 700;
        }

        .form-control {
            width: 100%;
            min-height: 44px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 12px;
            font: inherit;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(20, 107, 99, 0.14);
            outline: none;
        }

        .field-errors,
        .text-danger {
            margin: 6px 0 0;
            color: var(--danger);
            font-size: 14px;
            line-height: 1.4;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 8px 12px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            background: #fff;
        }

        .btn:hover {
            text-decoration: none;
        }

        .btn-primary,
        .btn-success {
            color: #fff;
            background: var(--primary);
        }

        .btn-primary:hover,
        .btn-success:hover {
            background: var(--primary-dark);
        }

        .btn-default {
            color: var(--ink);
            border-color: var(--line);
        }

        .btn-danger {
            color: #fff;
            background: var(--danger);
        }

        .badge {
            display: inline-flex;
            border-radius: 999px;
            padding: 4px 9px;
            font-size: 13px;
            font-weight: 700;
        }

        .badge-success {
            background: rgba(28, 124, 84, 0.12);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(154, 101, 0, 0.13);
            color: var(--warning);
        }

        .messages {
            display: grid;
            gap: 10px;
            margin-bottom: 18px;
        }

        .message {
            border: 1px solid rgba(28, 124, 84, 0.25);
            border-radius: 8px;
            padding: 10px 12px;
            background: rgba(28, 124, 84, 0.08);
            color: #28533f;
        }

        @media (max-width: 760px) {
            .topbar-inner,
            .page {
                padding-left: 16px;
                padding-right: 16px;
            }

            .page-header,
            .topbar-inner {
                align-items: flex-start;
                flex-direction: column;
                justify-content: flex-start;
                padding-top: 16px;
                padding-bottom: 16px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{% url 'users:user_list' %}">
                <span class="brand-mark">S24</span>
                <span>Panel operatora Szyfr24</span>
            </a>
            <form method="post" action="{% url 'authentication:logout' %}">
                {% csrf_token %}
                <button class="btn btn-default" type="submit">Wyloguj</button>
            </form>
        </div>
    </header>
    <main class="page">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
